# 5タブ横断ナビゲーション
appId: com.matomebeta_app
---
- launchApp
- assertVisible: '😁まとめくん😁'
- tapOn: 'Ranking'
- assertVisible: 'Daily'
- assertVisible: 'Weekly'
- tapOn: 'MyPage'
- assertVisible: 'History'
- assertVisible: 'Favorite'
# 設定メニューは1.45で日本語化済み(ストアレビュー指摘対応)
- tapOn: 'Setting'
- assertVisible: 'Edit Name'
- assertVisible: '表示サイトの選択'
- tapOn: 'Home'
- assertVisible: 'for You'
