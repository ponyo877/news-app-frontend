<!-- まとめくん アプリアイコン(原本)
     「複数のまとめサイトが1か所に集まる」= 69サイト横断と話題検知を形にしたもの。
     左上へ後退する重なりにしているのは、左右対称に置くと耳に見えて猫の顔と読めてしまうため。
     48pxでの可読性を優先し、要素は「重なり」と「笑顔」の2つに絞っている。
     線幅46は1024px時の値。これ以下にすると48pxで白が繋がって塊になる。
     PNGの生成は scripts/build-icons.sh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#F39800"/>
  <rect x="120" y="140" width="480" height="330" rx="90" fill="#FFFFFF"/>
  <rect x="196" y="216" width="520" height="360" rx="95" fill="#FFFFFF" stroke="#F39800" stroke-width="46"/>
  <path d="M382 316 H752 A104 104 0 0 1 856 420 V624 A104 104 0 0 1 752 728 H520 L396 858 L436 728 H382 A104 104 0 0 1 278 624 V420 A104 104 0 0 1 382 316 Z"
        fill="#FFFFFF" stroke="#F39800" stroke-width="46" stroke-linejoin="round"/>
  <g fill="#F39800">
    <circle cx="484" cy="474" r="30"/>
    <circle cx="650" cy="474" r="30"/>
  </g>
  <path d="M480 570 Q567 646 654 570" fill="none" stroke="#F39800" stroke-width="38" stroke-linecap="round"/>
</svg>
